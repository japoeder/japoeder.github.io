    <line x1="640" y1="300" x2="980" y2="720"/><line x1="640" y1="300" x2="1480" y2="720"/>
    <line x1="0" y1="580" x2="1280" y2="580"/><line x1="0" y1="650" x2="1280" y2="650"/>
  </g>
