    <rect x="390" y="430" width="80" height="70" rx="3" fill="#8a7a62"/><rect x="474" y="430" width="80" height="70" rx="3" fill="#7d6e58"/>
    <rect x="404" y="362" width="76" height="66" rx="3" fill="#7d6e58"/><rect x="484" y="370" width="62" height="58" rx="3" fill="#8a7a62"/>
