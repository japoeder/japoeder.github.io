<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t">
  <title id="t">Stylized warehouse aisle with detection boxes drawn around a worker, a forklift, and a stack of boxes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f26"/><stop offset="1" stop-color="#101216"/></linearGradient>
    <clipPath id="fl"><rect x="0" y="520" width="1280" height="200"/></clipPath>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20252d"/><stop offset="1" stop-color="#15181d"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <polygon points="0,520 1280,520 1280,720 0,720" fill="url(#floor)"/>
  <g stroke="#2c323c" stroke-width="2" clip-path="url(#fl)">
