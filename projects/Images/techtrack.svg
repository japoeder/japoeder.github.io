    <rect x="1022" y="256" width="40" height="44" rx="3"/><rect x="1068" y="266" width="34" height="34" rx="3"/><rect x="1132" y="244" width="76" height="56" rx="3"/>
    <rect x="1022" y="344" width="80" height="56" rx="3"/><rect x="1140" y="356" width="60" height="44" rx="3"/>
  </g>
