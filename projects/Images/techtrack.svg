    <rect x="50" y="200" width="282" height="9"/><rect x="50" y="300" width="282" height="9"/><rect x="50" y="400" width="282" height="9"/><rect x="50" y="510" width="282" height="9"/>
  </g>
  <g fill="#5a616c">
