    <rect x="72" y="248" width="104" height="52" rx="3"/><rect x="212" y="262" width="44" height="38" rx="3"/><rect x="262" y="250" width="48" height="50" rx="3"/>
    <rect x="80" y="352" width="60" height="48" rx="3"/><rect x="212" y="340" width="100" height="60" rx="3"/>
