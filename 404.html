<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>404 — Jonathan Poeder</title>
  <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Expanded:wght@500;600;700;800;900&family=Inter+Tight:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fabric.css">
  <style>
    .err {
      min-height: 100svh; background: var(--black); color: #fff;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    }
    .err h1 {
      font-family: var(--display); font-stretch: 125%; font-weight: 900; text-transform: uppercase;
      font-size: clamp(5rem, 28vw, 22rem); line-height: 0.85; letter-spacing: -0.03em; margin: 0;
    }
    .err h1 .accent { color: var(--accent); }
    .err p { color: rgba(255,255,255,0.7); max-width: 44ch; margin: 1.5rem 0 2.5rem; font-size: 1.15rem; }
  </style>
</head>
<body>
  <section class="err">
    <div class="wrap">
      <div class="mono" style="color:var(--accent); margin-bottom:1.5rem;">Error 404</div>
      <h1>Lost<span class="accent">.</span></h1>
      <p>This page wandered off the model. Let's get you back to something that exists.</p>
      <a class="btn btn-accent" href="/">Back home <span class="arr">→</span></a>
    </div>
  </section>
</body>
</html>
